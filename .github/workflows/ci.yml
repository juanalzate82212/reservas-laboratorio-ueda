name: CI

# Convierte la regla 5 del §16 del plan ("npm run build debe pasar limpio al
# cerrar cada fase") en algo que la máquina verifica, en vez de algo que hay que
# recordar. Es el status check exigido para poder mergear a main.
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

# Un PR con varios push seguidos cancela las ejecuciones viejas.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, tipos y build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Debe coincidir con .nvmrc, engines de package.json y Vercel.
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Comprobar tipos
        run: npm run typecheck

      # Va ANTES del build a propósito: es la comprobación más rápida de las
      # dos, y si el dominio está roto no tiene sentido esperar a compilar la
      # aplicación entera para enterarse.
      #
      # La suite arranca con un solo fichero (lib/availability.test.ts) y crece
      # en la fase 1 de FUSION-DATACUEVA.md. No lleva variables de entorno
      # porque nada de lo que prueba toca la base de datos.
      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # El build no se conecta a la base de datos, pero Prisma exige que las
          # variables existan para validar el bloque datasource del schema.
          DATABASE_URL: postgresql://user:pass@localhost:5432/db?pgbouncer=true&connection_limit=1
          DIRECT_URL: postgresql://user:pass@localhost:5432/db
          AUTH_SECRET: valor-solo-para-el-build-de-ci
          ADMIN_PASSWORD: valor-solo-para-el-build-de-ci
          NEXT_PUBLIC_APP_URL: http://localhost:3000
